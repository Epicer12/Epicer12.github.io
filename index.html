<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Epicer12 - open source projects</title>
  <meta name="description" content="Open source projects by Hasun Tisera, including Wordocs, a Google Docs add-on for captions, lists and cross-references.">
  <link rel="icon" href="https://epicer12.github.io/Wordocs/icon-128.png">
  <style>
    :root { --bg:#ffffff; --fg:#202124; --muted:#5f6368; --accent:#1a73e8; --card:#f8f9fa; --line:#dadce0; }
    @media (prefers-color-scheme: dark) { :root { --bg:#202124; --fg:#e8eaed; --muted:#9aa0a6; --accent:#8ab4f8; --card:#2d2e31; --line:#3c4043; } }
    * { box-sizing: border-box; }
    body { margin:0; font-family: "Google Sans", Roboto, Arial, sans-serif; background:var(--bg); color:var(--fg); line-height:1.6; }
    main { max-width: 720px; margin: 0 auto; padding: 64px 20px; }
    h1 { font-size: 2rem; margin: 0 0 6px; }
    p.lead { color: var(--muted); margin: 0 0 32px; }
    a { color: var(--accent); }
    .card { display:flex; gap:16px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 20px; text-decoration:none; color:inherit; }
    .card img { width:56px; height:56px; }
    .card strong { display:block; font-size:1.15rem; }
    .card span { color: var(--muted); }
    footer { margin-top: 40px; color: var(--muted); font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Epicer12</h1>
    <p class="lead">Open source projects by Hasun Tisera.</p>
    <a class="card" href="https://epicer12.github.io/Wordocs/">
      <img src="https://epicer12.github.io/Wordocs/icon-128.png" alt="Wordocs logo">
      <div>
        <strong>Wordocs</strong>
        <span>Word-style numbered captions, lists of tables and figures, and cross-references for Google Docs.</span>
      </div>
    </a>
    <footer>
      <a href="https://github.com/Epicer12">GitHub profile</a> &middot;
      <a href="https://epicer12.github.io/Wordocs/privacy.html">Wordocs privacy policy</a> &middot;
      <a href="mailto:hntsoftwares@gmail.com">Contact</a>
    </footer>
  </main>
</body>
</html>
